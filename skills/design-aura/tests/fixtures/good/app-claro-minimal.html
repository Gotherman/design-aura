<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preferências de notificação</title>
<style>
:root{--z1:#f7f7f8;--z2:#ffffff;--line:#e4e4e7;--ink:#18181b;--muted:#52525b;--primary:#0f766e}
[data-theme="dark"]{--z1:#111113;--z2:#1a1a1d;--line:#2e2e33;--ink:#f4f4f5;--muted:#a1a1aa;--primary:#2dd4bf}
*{box-sizing:border-box}body{margin:0;background:var(--z1);color:var(--ink);font:15px/1.5 system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100dvh}
aside{border-right:1px solid var(--line);padding:24px 16px;background:var(--z2)}
aside nav{display:grid;gap:4px;margin-top:24px}
aside nav a{padding:8px 12px;border-radius:6px;color:var(--muted);text-decoration:none}
aside nav a[aria-current]{background:color-mix(in srgb,var(--primary) 12%,transparent);color:var(--ink)}
main{padding:40px}
.panel{max-width:40rem;background:var(--z2);border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-0.01em}p{color:var(--muted);margin:0 0 24px}
form{display:grid;gap:16px}label{font-weight:600;display:block;margin-bottom:6px}
input,select{width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--z2);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
button{justify-self:start;min-height:40px;padding:0 16px;border:0;border-radius:8px;background:var(--primary);color:#fff;font:600 14px system-ui}
[data-theme="dark"] button{color:#042f2e}
</style></head>
<body><div class="shell">
<aside><strong>Ponto Claro</strong><nav aria-label="Configurações"><a href="#">Perfil</a><a href="#" aria-current="page">Notificações</a><a href="#">Equipe</a></nav></aside>
<main><div class="panel"><h1>Notificações</h1><p>Escolha quando a equipe recebe avisos de ponto pendente.</p>
<form><div><label for="canal">Canal</label><select id="canal"><option>E-mail</option><option>Aplicativo</option></select></div>
<div><label for="horario">Horário do resumo diário</label><input id="horario" type="time" value="18:00"></div>
<button type="button">Salvar preferências</button></form></div></main>
</div></body></html>
