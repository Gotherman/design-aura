<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório de estoque</title>
<style>
body{margin:0;background:#f5f5f2;color:#1b1d1a;font:15px/1.5 system-ui,sans-serif}
.page{width:1180px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 12px}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.bar button{min-height:40px;padding:0 16px;border:0;border-radius:8px;background:#2f5d46;color:#fff;font:600 14px system-ui}
.cols{display:grid;grid-template-columns:repeat(3,380px);gap:20px}
.col{background:#fff;border:1px solid #d9dcd5;border-radius:10px;padding:16px}
.col h2{font-size:16px;margin:0 0 8px;white-space:nowrap;overflow:hidden;width:120px}
</style></head>
<body><div class="page">
<h1>Relatório de estoque</h1>
<div class="bar"><button type="button">Exportar planilha</button><span>Atualizado às 09:40</span></div>
<div class="cols">
<section class="col"><h2>Hortifrúti e frios selecionados</h2><p>142 itens · 12 abaixo do mínimo</p></section>
<section class="col"><h2>Mercearia</h2><p>380 itens · 4 abaixo do mínimo</p></section>
<section class="col"><h2>Limpeza</h2><p>96 itens · nenhum abaixo do mínimo</p></section>
</div></div></body></html>
